# Application questions to draft answers for.
#
# Phases 14 and 15 read the real questions off the employer's form and pass
# them to generation.answers directly. Until then these are the ones almost
# every Australian graduate application asks, so the answerer is exercised
# against real questions rather than waiting for a form reader to exist.
#
# `required: true` means an unanswered question blocks submission (architecture
# 9: "the application cannot be submitted while any required question is
# unanswered"). Nothing here is required, and that is deliberate: these are
# placeholders, not questions an employer has actually asked. Marking a
# speculative question required held every application at DRAFT forever --
# "why do you want to work here?" is not answerable from profile facts, so the
# gate could never clear. Real required questions arrive from the form in
# Phase 15, and those are the ones that should block.
#
# They still get drafted and still become open_questions when unanswerable, so
# you see them and can answer them from the dashboard; they just do not hold
# the application hostage.

- question_key: why_this_role
  question_text: Why are you interested in this role?
  required: false

- question_key: why_this_company
  question_text: Why do you want to work for this company?
  required: false

- question_key: relevant_experience
  question_text: Describe your most relevant experience for this position.
  required: false

- question_key: technical_strength
  question_text: What is your strongest technical skill, and what have you built with it?
  required: false

- question_key: teamwork_example
  question_text: Describe a time you worked in a team to deliver something under pressure.
  required: false

# Expected to be unanswerable from the public profile: the salary floor lives
# in the sensitive schema, which the drafting path structurally cannot read.
- question_key: salary_expectations
  question_text: What are your salary expectations?
  required: false

- question_key: notice_period
  question_text: What is your notice period or earliest start date?
  required: false
